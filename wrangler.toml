name = "join-request-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Раз в час: отклонить заявки, на которые не ответили за EXPIRE_HOURS
[triggers]
crons = ["0 * * * *"]

[vars]
# Общий чат квартала (куда подают заявки). Узнать id: написать /chatid в группе.
MAIN_CHAT_ID = "-1001292851334"
# Закрытый чат админов, куда приходят карточки заявок (пока — личка владельца с ботом)
ADMIN_CHAT_ID = "252157449"
# Через сколько часов без ответа заявка отклоняется автоматически
EXPIRE_HOURS = "48"
# id чатов домов через запятую. Бот должен быть в них участником (админом не обязательно).
# В карточке будет видно, в каком из них состоит заявитель.
HOUSE_CHAT_IDS = ""

[[d1_databases]]
binding = "DB"
database_name = "join-bot"
database_id = "ff5d8288-64ac-4323-8cf9-53032aa09b6f"
